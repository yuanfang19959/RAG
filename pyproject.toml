[project]
name = "rag"
version = "0.1.0"
description = "FastAPI RAG service (P0 skeleton)"
readme = "README.md"
authors = [
    { name = "郑智斌", email = "544080261@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"
